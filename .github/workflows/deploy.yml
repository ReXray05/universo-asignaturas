name: Publicar Universo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar con la ruta pública correcta
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          if [[ -n "$CUSTOM_DOMAIN" || "$REPOSITORY_NAME" == *.github.io ]]; then
            npm run build -- --base=/
          else
            npm run build -- --base="/$REPOSITORY_NAME/"
          fi
          if [[ -n "$CUSTOM_DOMAIN" ]]; then printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
